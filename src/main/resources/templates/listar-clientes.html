<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - KinalApp</title>
    <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<nav class="navbar">
    <div class="logo">KinalApp POS</div>

    <ul class="nav-links">
        <li><a th:href="@{/clientes}">Clientes</a></li>
        <li><a th:href="@{/productos}">Productos</a></li>
        <li><a th:href="@{/usuarios}">Usuarios</a></li>
        <li><a th:href="@{/ventas}">Ventas</a></li>
    </ul>

    <div class="user-info">
        <span>Bienvenido, <b th:text="${session.usuarioLogueado}">Usuario</b></span>
        <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <h2>Listado de Clientes</h2>

    <table>
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.dpiCliente}"></td>
            <td th:text="${cliente.nombreCliente}"></td>
            <td th:text="${cliente.apellidoCliente}"></td>
            <td th:text="${cliente.direccion}"></td>
            <td th:text="${cliente.estado == 1 ? 'Activo' : 'Inactivo'}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="5" style="text-align: center;">No hay clientes registrados en el sistema.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
