<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">KinalApp</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/productos}">Productos</a>
            <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
            <a class="nav-link active" th:href="@{/ventas}">Ventas</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3><i class="fas fa-shopping-cart me-2"></i>Historial de Ventas</h3>
            <a th:href="@{/ventas/nuevo}" class="btn btn-light rounded-pill border-0 shadow-sm">
                <i class="fas fa-plus-circle me-1"></i>Nueva Venta
            </a>
        </div>
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead class="table-light text-center">
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Vendedor</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody class="text-center align-middle">
                <tr th:each="v : ${ventas}">
                    <td th:text="${v.codigoVenta}"></td>
                    <td th:text="${v.fechaVenta}"></td>
                    <td th:text="${v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente}"></td>
                    <td th:text="${v.usuario.username}"></td>
                    <td class="fw-bold" th:text="'Q' + ${#numbers.formatDecimal(v.total, 1, 2)}"></td>
                    <td>
                                <span th:class="${v.estado == 1 ? 'badge bg-success' : 'badge bg-danger'}"
                                      th:text="${v.estado == 1 ? 'ACTIVA' : 'ANULADA'}"></span>
                    </td>
                    <td>
                        <a th:href="@{/ventas/detalle/{id}(id=${v.codigoVenta})}" class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i> Detalle
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
