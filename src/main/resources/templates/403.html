<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado · KinalApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F6F9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-card {
            background: white;
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            background-color: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1.5rem;
        }
        h1 {
            color: #1e2a3a;
            margin-bottom: 1rem;
        }
        p {
            color: #64748b;
            margin-bottom: 2rem;
        }
        .btn-home {
            background-color: #2C3E50;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-home:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1>Acceso Restringido</h1>
        <p>Lo sentimos, no tienes los permisos necesarios para acceder a esta sección del sistema. Si crees que esto es un error, contacta al administrador ;).</p>
        <a th:href="@{/dashboard}" class="btn-home">
            <i class="fas fa-home"></i> Volver al Dashboard
        </a>
    </div>
</body>
</html>
